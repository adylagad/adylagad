  <style>
    .dot-light { transform-box: fill-box; transform-origin: center; animation-name: pop; animation-duration: 0.35s; animation-timing-function: cubic-bezier(0.34,1.56,0.64,1); animation-fill-mode: both; }
    .fade-light { animation-name: fadein; animation-duration: 0.5s; animation-timing-function: ease-out; animation-fill-mode: both; }
    .subfade-light { animation-name: fadein-sub; animation-duration: 0.35s; animation-timing-function: ease-out; animation-fill-mode: both; }
    .rail-light { stroke-dasharray: 380; stroke-dashoffset: 380; animation: draw-light 2s cubic-bezier(0.45,0,0.55,1) both; }
    @keyframes draw-light { to { stroke-dashoffset: 0; } }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes fadein { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes fadein-sub { from { opacity: 0; } to { opacity: 1; } }
  </style>
