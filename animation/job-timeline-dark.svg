<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs><linearGradient id="rail-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient></defs>
  <style>
    .dot-dark { transform-box: fill-box; transform-origin: center; animation-name: pop; animation-duration: 0.35s; animation-timing-function: cubic-bezier(0.34,1.56,0.64,1); animation-fill-mode: both; }
    .fade-dark { animation-name: fadein; animation-duration: 0.5s; animation-timing-function: ease-out; animation-fill-mode: both; }
    .subfade-dark { animation-name: fadein-sub; animation-duration: 0.35s; animation-timing-function: ease-out; animation-fill-mode: both; }
    #line-dark { stroke-dasharray: 342; stroke-dashoffset: 342; animation: draw-dark 2s cubic-bezier(0.45,0,0.55,1) both; }
    @keyframes draw-dark { to { stroke-dashoffset: 0; } }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes fadein { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes fadein-sub { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <rect width="720" height="500" fill="#0d1117"/>
  <line id="line-dark" x1="60" y1="76" x2="60" y2="418" stroke="url(#rail-dark)" stroke-width="2" stroke-linecap="round"/>
  <circle class="dot-dark" cx="60" cy="76" r="8" fill="#0d1117" stroke="#818cf8" stroke-width="2" style="animation-delay:0.00s"/>
<g class="fade-dark" style="animation-delay:0.05s">
<text x="72" y="68" font-size="21" font-weight="700" fill="#e6edf3">Junior Software Engineer <tspan fill="#818cf8" font-weight="600">@ Fetch.ai</tspan> <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fb923c"> May 2026 — Present</tspan></text>
<text x="72" y="94" font-size="14" fill="#8b949e">Building AI agents and contributing to the ASI One mobile team.</text>
</g>
<circle class="dot-dark" cx="60" cy="156" r="8" fill="#0d1117" stroke="#818cf8" stroke-width="2" style="animation-delay:0.47s"/>
<g class="fade-dark" style="animation-delay:0.52s">
