<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .dot-dark { transform-box: fill-box; transform-origin: center; animation-name: pop; animation-duration: 0.35s; animation-timing-function: cubic-bezier(0.34,1.56,0.64,1); animation-fill-mode: both; }
    .fade-dark { animation-name: fadein; animation-duration: 0.5s; animation-timing-function: ease-out; animation-fill-mode: both; }
    .subfade-dark { animation-name: fadein-sub; animation-duration: 0.35s; animation-timing-function: ease-out; animation-fill-mode: both; }
    .rail-dark { stroke-dasharray: 436; stroke-dashoffset: 436; animation: draw-dark 2s cubic-bezier(0.45,0,0.55,1) both; }
    @keyframes draw-dark { to { stroke-dashoffset: 0; } }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes fadein { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes fadein-sub { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <rect width="760" height="640" fill="#0d1117"/>
  <line class="rail-dark" x1="66" y1="102" x2="66" y2="538" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
  <circle class="dot-dark" cx="66" cy="102" r="8" fill="#0d1117" stroke="#818cf8" stroke-width="2" style="animation-delay:0.00s"/>
