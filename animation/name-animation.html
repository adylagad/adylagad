<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1000px;
    height: 220px;
    background: #0d1117;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    display: flex;
    align-items: baseline;
  }
  #prefix {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 64px;
    font-weight: 500;
    color: #8b949e;
    white-space: pre;
  }
  #name {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 110px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #818cf8;
    white-space: pre;
  }
  #name .char {
    display: inline-block;
  }
</style>
</head>
<body>
  <div id="stage">
    <span id="prefix">Hi, I'm </span><div id="name">Aditya</div>
  </div>

  <script src="gsap.min.js"></script>
  <script src="SplitText.min.js"></script>
  <script src="ScrambleTextPlugin.min.js"></script>
  <script>
    gsap.registerPlugin(SplitText, ScrambleTextPlugin);

    window.animationDone = false;

    const INDIGO = "#818cf8";
    const ORANGE = "#fb923c";

    const split = SplitText.create("#name", { type: "chars" });
    const chars = split.chars; // [A, d, i, t, y, a]

    // Fixed (not Math.random-based) per-character variation, keyed by index
    // within each 6-char phase, so total timeline duration is deterministic
    // and reproducible run-to-run — required for capturing a seamless loop.
    const DURATIONS = [0.9, 1.15, 0.95, 1.2, 1.0, 1.1];
    const SPEEDS = [0.22, 0.32, 0.25, 0.35, 0.28, 0.3];
    const REVEALS = [0.3, 0.45, 0.35, 0.5, 0.32, 0.4];

    const LETTER_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const ICON_CHARS = "★▲●◆✦⬢✧▶■◼▽◎✱❖";
    // Only these positions (within each 6-char phase) scramble through
    // icon glyphs instead of letters -- keeps it as a rare accent, not
    // the whole word.
    const ICON_INDICES = new Set([1, 4]);

    function scrambleChar(el, toText, seedIdx) {
      return gsap.to(el, {
        duration: DURATIONS[seedIdx % DURATIONS.length],
        scrambleText: {
          text: toText,
          chars: ICON_INDICES.has(seedIdx) ? ICON_CHARS : LETTER_CHARS,
          speed: SPEEDS[seedIdx % SPEEDS.length],
          revealDelay: REVEALS[seedIdx % REVEALS.length]
        },
        ease: "none"
      });
    }

    function buildLetterStep(tl, el, toText, hide, startPos, seedIdx) {
      tl.add(scrambleChar(el, toText, seedIdx), startPos);
      tl.to(el, { color: ORANGE, duration: 0.4 }, "<");
      tl.to(el, { color: INDIGO, duration: 0.45 }, ">-0.05");
      if (hide !== null) {
        tl.to(el, { opacity: hide ? 0 : 1, duration: 0.55, ease: hide ? "power1.in" : "power1.out" }, "<");
      }
    }

    const master = gsap.timeline({
      repeat: -1,
      repeatDelay: 1.3,
      onRepeat: () => { window.animationDone = true; }
    });

    // Phase 1: Aditya -> Ady (each char scrambles individually, staggered)
    const shrinkPlan = [
      { i: 0, to: "A", hide: null },
      { i: 1, to: "d", hide: null },
      { i: 2, to: "y", hide: null },
      { i: 3, to: "t", hide: true },
      { i: 4, to: "y", hide: true },
      { i: 5, to: "a", hide: true }
    ];
    shrinkPlan.forEach((p, idx) => buildLetterStep(master, chars[p.i], p.to, p.hide, 0.6 + idx * 0.22, idx));

    master.addLabel("adyHold", "+=1.0");

    // Phase 2: Ady -> Aditya
    const expandPlan = [
      { i: 0, to: "A", hide: null },
      { i: 1, to: "d", hide: null },
      { i: 2, to: "i", hide: null },
      { i: 3, to: "t", hide: false },
      { i: 4, to: "y", hide: false },
      { i: 5, to: "a", hide: false }
    ];
    expandPlan.forEach((p, idx) => buildLetterStep(master, chars[p.i], p.to, p.hide, `adyHold+=${idx * 0.22}`, idx));

    window.master = master;
  </script>
</body>
</html>
