<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 700px;
    height: 220px;
    background: #05070c;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #name {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 110px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #818cf8;
    white-space: pre;
  }
  #name .char {
    display: inline-block;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="name">Aditya</div>
  </div>

  <script src="gsap.min.js"></script>
  <script src="SplitText.min.js"></script>
  <script src="ScrambleTextPlugin.min.js"></script>
  <script>
    gsap.registerPlugin(SplitText, ScrambleTextPlugin);

    window.animationDone = false;

    const INDIGO = "#818cf8";
    const ORANGE = "#fb923c";

    const split = SplitText.create("#name", { type: "chars" });
    const chars = split.chars; // [A, d, i, t, y, a]

    function scrambleChar(el, toText) {
      return gsap.to(el, {
        duration: gsap.utils.random(0.5, 0.75),
        scrambleText: {
          text: toText,
          chars: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
          speed: gsap.utils.random(0.3, 0.5),
          revealDelay: gsap.utils.random(0.15, 0.3)
        },
        ease: "none"
      });
    }

    function buildLetterStep(tl, el, toText, hide, startPos) {
      tl.add(scrambleChar(el, toText), startPos);
      tl.to(el, { color: ORANGE, duration: 0.25 }, "<");
      tl.to(el, { color: INDIGO, duration: 0.3 }, ">-0.05");
      if (hide !== null) {
        tl.to(el, { opacity: hide ? 0 : 1, duration: 0.35, ease: hide ? "power1.in" : "power1.out" }, "<");
      }
    }

    const master = gsap.timeline({
      repeat: -1,
      repeatDelay: 0.7,
      onRepeat: () => { window.animationDone = true; }
    });

    // Phase 1: Aditya -> Ady (each char scrambles individually, staggered)
    const shrinkPlan = [
      { i: 0, to: "A", hide: null },
      { i: 1, to: "d", hide: null },
      { i: 2, to: "y", hide: null },
      { i: 3, to: "t", hide: true },
      { i: 4, to: "y", hide: true },
      { i: 5, to: "a", hide: true }
    ];
    shrinkPlan.forEach((p, idx) => buildLetterStep(master, chars[p.i], p.to, p.hide, idx * 0.14));

    master.addLabel("adyHold", "+=0.6");

    // Phase 2: Ady -> Aditya
    const expandPlan = [
      { i: 0, to: "A", hide: null },
      { i: 1, to: "d", hide: null },
      { i: 2, to: "i", hide: null },
      { i: 3, to: "t", hide: false },
      { i: 4, to: "y", hide: false },
      { i: 5, to: "a", hide: false }
    ];
    expandPlan.forEach((p, idx) => buildLetterStep(master, chars[p.i], p.to, p.hide, `adyHold+=${idx * 0.14}`));
  </script>
</body>
</html>
