<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 900px;
    height: 320px;
    background: radial-gradient(circle at 50% 45%, #131a2b 0%, #0a0e17 65%, #05070c 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  #name {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 120px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #cfd8ea;
    white-space: pre;
    perspective: 600px;
  }
  #name .char {
    display: inline-block;
    transform-style: preserve-3d;
  }
  svg#underline {
    display: block;
    margin-top: -6px;
    overflow: visible;
  }
  svg#underline path {
    fill: none;
    stroke: #58a6ff;
    stroke-width: 6;
    stroke-linecap: round;
    filter: drop-shadow(0 0 8px rgba(88,166,255,0.9));
  }
  .spark {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #7ee787;
    opacity: 0;
    box-shadow: 0 0 10px 2px rgba(126,231,135,0.9);
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="name">Aditya</div>
    <svg id="underline" width="520" height="24" viewBox="0 0 520 24">
      <path d="M8,12 C150,12 370,12 512,12" />
    </svg>
  </div>

  <script src="gsap.min.js"></script>
  <script src="SplitText.min.js"></script>
  <script src="ScrambleTextPlugin.min.js"></script>
  <script src="DrawSVGPlugin.min.js"></script>
  <script>
    gsap.registerPlugin(SplitText, ScrambleTextPlugin, DrawSVGPlugin);

    window.animationDone = false;
    const nameEl = document.getElementById("name");
    const underline = document.querySelector("#underline path");
    const stage = document.getElementById("stage");

    gsap.set(underline, { drawSVG: "0%" });

    const master = gsap.timeline({
      onComplete: () => { window.animationDone = true; }
    });

    // Phase 1: scramble reveal into "Aditya"
    master.to(nameEl, {
      duration: 1.3,
      scrambleText: {
        text: "Aditya",
        chars: "ABCDEFGHIJKLMNOPQRSTUVWXYZ01#$%",
        revealDelay: 0.35,
        speed: 0.35,
        tweenLength: false
      },
      ease: "none"
    });

    // Phase 2: split into chars, flip/pop them into place with a color sweep
    master.call(() => {
      const split = SplitText.create(nameEl, { type: "chars" });

      gsap.set(split.chars, { transformOrigin: "50% 100%" });

      const pop = gsap.timeline();
      pop.from(split.chars, {
        rotationX: -100,
        y: 40,
        opacity: 0,
        scale: 0.4,
        duration: 0.6,
        ease: "back.out(2.2)",
        stagger: 0.06
      }).to(split.chars, {
        color: (i) => ["#58a6ff", "#79b8ff", "#7ee787", "#58a6ff", "#a5d6ff", "#58a6ff"][i % 6],
        textShadow: "0 0 22px rgba(88,166,255,0.75)",
        duration: 0.5,
        stagger: 0.05
      }, "<0.1");

      master.add(pop);

      // Phase 3: draw the underline once letters have popped
      master.to(underline, {
        drawSVG: "100%",
        duration: 0.8,
        ease: "power2.inOut"
      }, "-=0.3");

      // sparks flying off the underline tip
      for (let i = 0; i < 5; i++) {
        const spark = document.createElement("div");
        spark.className = "spark";
        stage.appendChild(spark);
        master.fromTo(spark, {
          x: -20 + i * 8,
          y: 130,
          opacity: 1,
          scale: 1
        }, {
          x: `+=${gsap.utils.random(-40, 40)}`,
          y: `+=${gsap.utils.random(-30, -60)}`,
          opacity: 0,
          scale: 0.2,
          duration: 0.6,
          ease: "power1.out"
        }, "-=0.7");
      }

      // Phase 4: idle float + underline glow pulse loop
      master.to(split.chars, {
        y: -10,
        duration: 0.9,
        ease: "sine.inOut",
        yoyo: true,
        repeat: 1,
        stagger: { each: 0.04, from: "center" }
      }, "+=0.1");

      master.to(underline, {
        filter: "drop-shadow(0 0 16px rgba(126,231,135,0.95))",
        duration: 0.6,
        ease: "sine.inOut",
        yoyo: true,
        repeat: 1
      }, "<");
    });
  </script>
</body>
</html>
