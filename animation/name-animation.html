<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 800px;
    height: 250px;
    background: #0d1117;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    display: flex;
  }
  .letter {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 110px;
    font-weight: 700;
    color: #58a6ff;
    display: inline-block;
    text-shadow: 0 0 20px rgba(88, 166, 255, 0.6);
  }
</style>
</head>
<body>
  <div id="stage">
    <span class="letter">A</span><span class="letter">d</span><span class="letter">i</span><span class="letter">t</span><span class="letter">y</span><span class="letter">a</span>
  </div>
  <script src="gsap.min.js"></script>
  <script>
    window.animationDone = false;
    const tl = gsap.timeline({
      onComplete: () => { window.animationDone = true; }
    });
    tl.from(".letter", {
      y: 60,
      opacity: 0,
      rotation: 10,
      duration: 0.7,
      ease: "back.out(2)",
      stagger: 0.08
    }).to(".letter", {
      color: "#7ee787",
      textShadow: "0 0 30px rgba(126,231,135,0.8)",
      duration: 0.5,
      stagger: 0.05
    }, "+=0.3").to(".letter", {
      y: -10,
      duration: 0.4,
      ease: "sine.inOut",
      yoyo: true,
      repeat: 1,
      stagger: 0.05
    }, "+=0.2");
  </script>
</body>
</html>
